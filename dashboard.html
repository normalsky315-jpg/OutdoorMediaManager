<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>吉隆天曜 OOH Media Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  #banner{
    display:none;background:var(--gold);color:var(--green-deep);font-weight:700;font-size:16px;
    padding:10px 16px;text-align:center;
  }
  #banner.show{display:block;}
  .layout{
    display:flex;height:calc(100vh - 128px);min-height:420px;
  }
  #mapPane{flex:1.3;position:relative;}
  #map{height:100%;width:100%;}
  #detailPane{
    flex:1;min-width:320px;max-width:460px;background:#fff;border-left:1px solid var(--line);
    overflow-y:auto;padding:16px;
  }
  #listPane{display:none;padding:16px;overflow:auto;height:calc(100vh - 128px);}
  table.list{width:100%;border-collapse:collapse;font-size:15.5px;background:#fff;}
  table.list th,table.list td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;}
  table.list th{background:#f5f1e6;color:var(--green);position:sticky;top:0;}
  table.list tr:hover{background:#fbf8f2;cursor:pointer;}
  .empty-detail{color:#a89f8d;text-align:center;padding:60px 10px;font-size:16px;}
  .d-title{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
  .d-title input.pname{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:21px;color:var(--green);
    border:none;border-bottom:1px dashed transparent;flex:1;min-width:0;background:transparent;
  }
  .d-title input.pname:focus{outline:none;border-bottom-color:var(--gold);}
  .d-gps{font-size:14.5px;color:#8a8378;margin-bottom:10px;}
  .d-gps a{color:#3a6ea5;text-decoration:none;}
  .d-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
  .d-gallery .ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:pointer;background:#f0ece0;}
  .d-gallery .ph img{width:100%;height:100%;object-fit:cover;}
  .d-addphoto{
    border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;color:#8a8378;cursor:pointer;text-align:center;aspect-ratio:1;
  }
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .fields.full{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:13.5px;color:#8a8378;}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:16px;font-family:inherit;background:#fdfcf8;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .d-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .lightbox{
    position:fixed;inset:0;background:rgba(10,15,12,.9);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .lightbox.open{display:flex;}
  .lightbox-stage{position:relative;display:inline-block;line-height:0;}
  .lightbox-stage img{
    display:block;border-radius:8px;
    max-width:95vw;max-height:92vh;
  }
  .lightbox-boxes{position:absolute;inset:0;}
  .lightbox .close{
    position:fixed;top:14px;right:14px;color:#fff;font-size:22px;
    background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);border-radius:50%;
    width:44px;height:44px;line-height:1;cursor:pointer;z-index:101;
    display:flex;align-items:center;justify-content:center;
  }
  .d-gallery .ph .box-badge{top:3px;left:3px;font-size:11px;padding:2px 6px;}
  .d-gallery .ph .ann-mark{bottom:3px;left:3px;width:24px;height:24px;font-size:13px;}
  .leaflet-marker-icon.tier-S{filter:hue-rotate(0deg);}
  #printArea{display:none;}
  @media print{
    header.top,#banner,.stat-bar,.layout,#listPane,.foot{display:none !important;}
    #printArea{display:block !important;}
    #printArea .p-page{page-break-after:always;padding:24px;}
    #printArea .p-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
    #printArea .p-photo-wrap{position:relative;line-height:0;}
    #printArea .p-photos img{width:100%;border-radius:6px;display:block;}
    #printArea .p-box{position:absolute;border:2px solid #e0393e;background:rgba(224,57,62,.12);box-sizing:border-box;}
    #printArea table{width:100%;border-collapse:collapse;font-size:13px;}
    #printArea td{padding:5px 8px;border-bottom:1px solid #ddd;}
    #printArea h2{font-family:'Noto Serif TC',serif;color:#163828;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="eyebrow">吉隆天曜 · 大寮回家動線</div>
    <h1>OOH Media Manager</h1>
  </div>
  <nav>
    <button class="btn" id="modeMapBtn">🗺 地圖模式</button>
    <button class="btn" id="modeListBtn">📋 列表模式</button>
    <button class="btn" id="addPinBtn">📍 新增點位</button>
    <button class="btn" id="addPhotoBtn">📷 上傳照片建立</button>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
    <a class="btn" href="index.html">↩ 回照片篩選</a>
    <button class="btn solid" id="exportExcelBtn">匯出 Excel</button>
    <button class="btn solid" id="printBtn">列印 / PDF 報告</button>
  </nav>
</header>
<div id="banner"></div>
<div class="stat-bar" id="statBar"></div>

<div class="layout" id="mapLayout">
  <div id="mapPane"><div id="map"></div></div>
  <div id="detailPane"></div>
</div>

<div id="listPane">
  <table class="list" id="listTable">
    <thead>
      <tr><th>區域</th><th>點位</th><th>評等</th><th>聯絡人</th><th>電話</th><th>租金</th><th>尺寸</th><th>照片</th><th>狀態</th></tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

<div id="printArea"></div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose">✕</button>
  <div class="lightbox-stage">
    <img id="lightboxImg" src="">
    <div class="lightbox-boxes" id="lightboxBoxes"></div>
  </div>
</div>

<div class="annotate-modal" id="annotateModal">
  <div class="annotate-box">
    <div class="annotate-head">
      <span>標記廣告看板範圍</span>
      <button class="btn small" id="annotateClearBtn">清除全部</button>
      <button class="btn small solid" id="annotateDoneBtn">完成</button>
      <button class="close" id="annotateCloseBtn">✕</button>
    </div>
    <div class="annotate-stage">
      <img id="annotateImg" src="">
      <div class="annotate-layer" id="annotateLayer"></div>
    </div>
    <p class="annotate-hint">在照片上拖曳畫出方框，標記廣告看板的位置範圍（可畫多個）。點框角上的 ✕ 可以刪除。</p>
  </div>
</div>

<footer class="foot">吉隆天曜 OOH 現勘管理系統 · 主管報告模式</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/annotate.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
