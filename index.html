<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>吉隆天曜 OOH 照片篩選</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  main{max-width:1180px;margin:0 auto;padding:0 14px 90px;}
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:6px 2px 14px;
  }
  .toolbar .spacer{flex:1;}
  #fileInput{display:none;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(640px,1fr));
    gap:14px;
  }
  .card{
    background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    overflow:hidden;display:flex;flex-direction:column;
    border:2px solid transparent;
    transition:opacity .2s, border-color .2s;
  }
  .card.discarded{opacity:.4;}
  .card.confirmed{border-color:var(--ok);}
  .card-head{
    padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .card-head input.name{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;color:var(--green);
    border:none;background:transparent;flex:1;min-width:0;border-bottom:1px dashed transparent;
  }
  .card-head input.name:focus{outline:none;border-bottom-color:var(--gold);}
  .area-row{padding:0 12px 6px;}
  .area-row input{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font-size:12px;background:#fdfcf8;color:var(--green);
  }
  .area-row input::placeholder{color:#a89f8d;}
  .thumbs{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 12px;
  }
  .thumb{
    position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:#f0ece0;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .fallback{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;color:#a89f8d;text-align:center;padding:2px;
  }
  .thumb .rm{
    position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:none;
    width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;
  }
  .thumb.discarded{opacity:.3;}
  .thumb.discarded::after{
    content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#c94b3f;font-size:36px;font-weight:900;
  }
  .meta-row{
    padding:8px 12px 2px;font-size:11.5px;color:#8a8378;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .meta-row a{color:#3a6ea5;text-decoration:none;}
  .field-row{
    display:flex;gap:8px;padding:8px 12px 0;align-items:center;
  }
  select.tier{
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fdfcf8;
  }
  textarea.note{
    margin:8px 12px;border:1px solid #e6dfcf;border-radius:6px;padding:7px 9px;
    font-family:inherit;font-size:12.5px;resize:vertical;min-height:38px;background:#fdfcf8;
  }
  .card-fields{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0;
  }
  .card-field{display:flex;flex-direction:column;gap:3px;}
  .card-field label{font-size:11px;color:#8a8378;}
  .card-field input{
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;
    font-family:inherit;background:#fdfcf8;
  }
  .card-actions{
    margin-top:auto;display:flex;gap:6px;padding:8px 12px 12px;
  }
  .unlocated-note{
    margin:0 12px 8px;font-size:11px;color:var(--warn);background:#fbf2e2;padding:6px 8px;border-radius:6px;
  }
  .sticky-bottom{
    position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;gap:12px;
    box-shadow:0 -4px 12px rgba(0,0,0,.08);z-index:40;flex-wrap:wrap;
  }
  .sticky-bottom .info{font-size:12.5px;color:#8a8378;flex:1;}
  .lightbox{
    position:fixed;inset:0;background:rgba(10,15,12,.9);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .lightbox.open{display:flex;}
  .lightbox-stage{position:relative;display:inline-block;line-height:0;}
  .lightbox-stage img{
    max-width:min(88vw,820px);max-height:min(78vh,720px);
    width:auto;height:auto;border-radius:8px;display:block;object-fit:contain;
  }
  .lightbox-boxes{position:absolute;inset:0;}
  .lightbox .close{
    position:fixed;top:14px;right:14px;color:#fff;font-size:22px;
    background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);border-radius:50%;
    width:44px;height:44px;line-height:1;cursor:pointer;z-index:101;
    display:flex;align-items:center;justify-content:center;
  }
  .pin-modal{
    position:fixed;inset:0;background:rgba(10,15,12,.75);z-index:110;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .pin-modal.open{display:flex;}
  .pin-box{background:#fff;border-radius:12px;overflow:hidden;width:100%;max-width:520px;}
  .pin-box header{padding:12px 16px;background:var(--green);color:#fff;font-weight:700;font-size:14px;}
  #pinMap{height:340px;width:100%;}
  .pin-box footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;}
  .empty-hint{
    text-align:center;color:#a89f8d;padding:60px 20px;font-size:13px;
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="eyebrow">吉隆天曜 · OOH Media Manager</div>
    <h1>照片篩選與點位確認</h1>
  </div>
  <nav>
    <button class="btn" id="addPhotoBtn">＋ 加入照片</button>
    <a class="btn solid" href="dashboard.html">前往主管報告 →</a>
  </nav>
</header>
<input type="file" id="fileInput" accept="image/*" multiple>

<div class="stat-bar" id="statBar"></div>

<main>
  <div class="toolbar">
    <button class="btn small" id="expandAll">全部展開</button>
    <button class="btn small" id="collapseAll">全部收合</button>
    <span class="spacer"></span>
    <button class="btn small" id="exportBackup">匯出備份 JSON</button>
    <button class="btn small" id="importBtn">匯入備份</button>
    <input type="file" id="importInput" accept="application/json" style="display:none">
  </div>
  <div class="grid" id="grid"></div>
  <datalist id="areaList"></datalist>
  <p class="tip" style="margin:16px 2px;padding:12px 14px;background:#fff;border-left:4px solid var(--gold);border-radius:4px;font-size:12.5px;line-height:1.6;">
    <b>操作說明：</b>系統已依照片 GPS 座標自動群聚成候選點位。請逐一檢查每個點位的照片，把不需要的照片打 ✕ 移除、幫點位命名並標註評等；不需要的點位可直接「捨棄」。完成後按下方「確認並前往主管報告」。
  </p>
</main>

<div class="sticky-bottom">
  <span class="info" id="bottomInfo">載入中…</span>
  <button class="btn" id="discardAllPending">全部捨棄未處理</button>
  <button class="btn solid" id="confirmAllBtn">✓ 確認並前往主管報告</button>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose">✕</button>
  <div class="lightbox-stage">
    <img id="lightboxImg" src="">
    <div class="lightbox-boxes" id="lightboxBoxes"></div>
  </div>
</div>

<div class="annotate-modal" id="annotateModal">
  <div class="annotate-box">
    <div class="annotate-head">
      <span>標記廣告看板範圍</span>
      <button class="btn small" id="annotateClearBtn">清除全部</button>
      <button class="btn small solid" id="annotateDoneBtn">完成</button>
      <button class="close" id="annotateCloseBtn">✕</button>
    </div>
    <div class="annotate-stage">
      <img id="annotateImg" src="">
      <div class="annotate-layer" id="annotateLayer"></div>
    </div>
    <p class="annotate-hint">在照片上拖曳畫出方框，標記廣告看板的位置範圍（可畫多個）。點框角上的 ✕ 可以刪除。</p>
  </div>
</div>

<div class="pin-modal" id="pinModal">
  <div class="pin-box">
    <header>在地圖上點選這張照片的位置</header>
    <div id="pinMap"></div>
    <footer>
      <button class="btn small" id="pinCancel">取消</button>
      <button class="btn solid small" id="pinConfirm" disabled>確認位置</button>
    </footer>
  </div>
</div>

<footer class="foot">吉隆天曜 OOH 現勘管理系統 · 照片篩選模式</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/annotate.js"></script>
<script src="assets/js/review.js"></script>
</body>
</html>
